<!DOCTYPE html>
<html>
<head>
    <title>Book {{ p.title }}</title>
    {% load static %}
    {% load price_tags %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <h1><b>MJ</b> <i>Real Estates</i></h1>

    <div class="booking">
        <img src="{% static p.image.name %}" alt="{{ p.title }}">
        <h2>{{ p.title }}</h2>
        <p>{{ p.city }}</p>
        <p class="price">₹{{ p.price|inr }}</p>

        {% if message %}
    <div class="popup-bg">
        <div class="popup">
            <h2>🎉Congratulations!🎉</h2>
            <p>{{ message }}</p>
            <a href="/">Back to Home</a>
        </div>
    </div>
{% else %}
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Confirm Booking</button>
    </form>
{% endif %}

        <br>
        <a href="/">Back to Home</a>
    </div>

</body>
</html>
